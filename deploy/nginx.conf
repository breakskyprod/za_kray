# ===========================================
#  Nginx для проекта "За край"
#  Разместить: /etc/nginx/sites-available/zakray
#  Активировать:
#     sudo ln -s /etc/nginx/sites-available/zakray /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
#  Замените:
#    - server_name на ваш домен
#    - /var/www/za_kray на реальный путь к проекту на VPS
# ===========================================

# Ограничение частоты запросов к API (защита от накрутки/спама)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name zakray.ru www.zakray.ru;   # ← ваш домен

    # Макс. размер тела запроса (прогресс зрителя маленький)
    client_max_body_size 1m;

    # --- ВИДЕО: Nginx отдаёт файлы напрямую, минуя Node ---
    # Это снимает с Node всю нагрузку по раздаче тяжёлых файлов.
    location /uploads/ {
        alias /var/www/za_kray/server/uploads/;   # ← путь к видео на VPS
        # Range-запросы (перемотка) nginx поддерживает из коробки
        add_header Accept-Ranges bytes;
        # Долгий кэш — имена файлов версионируются качеством (_720/_1080)
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- API: проксируем на Node ---
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --- Остальной фронтенд тоже через Node (раздаёт express.static) ---
    # При желании можно раздавать frontend напрямую Nginx — см. комментарий ниже.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Альтернатива (быстрее): отдавать статику фронтенда напрямую ---
    # Раскомментируйте и закомментируйте блок location / выше, если хотите,
    # чтобы Nginx отдавал HTML/CSS/JS сам, а на Node уходили только /api:
    #
    # root /var/www/za_kray/frontend;
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }
}

# ===========================================
#  HTTPS: после настройки домена установите бесплатный сертификат
#    sudo apt install certbot python3-certbot-nginx
#    sudo certbot --nginx -d zakray.ru -d www.zakray.ru
#  Certbot сам добавит listen 443 и редирект с http на https.
# ===========================================
