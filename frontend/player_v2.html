<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>За край — плеер</title>
    <link rel="stylesheet" href="player_v2.css" />
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0b0b1a">
</head>
<body>
    <div class="player" id="player">
        <video id="videoPlayer" preload="metadata" playsinline webkit-playsinline></video>
        <video id="insertPlayer" class="insert-player" preload="auto" playsinline webkit-playsinline></video>
        <audio id="choiceAmbient" preload="auto" loop></audio>

        <div id="overlay" class="overlay"></div>
        <div class="buffering" id="bufferingSpinner"></div>

        <div id="choiceCountdown" class="choice-countdown hidden">
            <svg viewBox="0 0 44 44" class="countdown-ring">
                <circle cx="22" cy="22" r="19" class="ring-bg"></circle>
                <circle cx="22" cy="22" r="19" class="ring-fg" id="countdownRing"></circle>
            </svg>
            <span class="countdown-number" id="countdownNumber">10</span>
        </div>

        <button class="skip-btn hidden" id="skipBtn" title="Следующая серия">
            <span>Следующая серия</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 4 15 12 5 20 5 4" fill="currentColor"/>
                <line x1="19" y1="5" x2="19" y2="19"/>
            </svg>
        </button>

        <div class="controls" id="controls">
            <div class="top-bar">
                <div class="top-bar-left">
                    <button class="back-home-btn" id="backHomeBtn" title="На главную">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"/>
                            <polyline points="12 19 5 12 12 5"/>
                        </svg>
                        <span class="back-text">На главную</span>
                    </button>
                    <button class="restart-btn" id="restartProgressBtn" title="Начать заново">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 12a9 9 0 1 0 3-6.7"/>
                            <polyline points="3 4 3 10 9 10"/>
                        </svg>
                        <span class="restart-text">Заново</span>
                    </button>
                </div>

                <div class="title-block">
                    <span class="series-title" id="seriesTitleText"></span>
                </div>

                <div class="top-bar-spacer"></div>
            </div>

            <div class="bottom-bar">
                <div class="timeline" id="timeline">
                    <div class="timeline-buffered" id="timelineBuffered"></div>
                    <div class="timeline-progress" id="timelineProgress"></div>
                    <div class="timeline-thumb" id="timelineThumb"></div>
                </div>
                <div class="buttons-row">
                    <button class="ctrl-btn" id="playPauseBtn" title="Воспроизведение">
                        <svg class="icon icon-play" viewBox="0 0 24 24" fill="currentColor">
                            <polygon points="6,4 20,12 6,20"/>
                        </svg>
                        <svg class="icon icon-pause" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="6" y="4" width="4" height="16" rx="1"/>
                            <rect x="14" y="4" width="4" height="16" rx="1"/>
                        </svg>
                    </button>
                    <div class="time-display">
                        <span id="currentTime">0:00</span>
                        <span class="sep">/</span>
                        <span id="duration">0:00</span>
                    </div>
                    <div class="volume-block">
                        <button class="ctrl-btn volume-high" id="volumeBtn" title="Громкость">
                            <svg class="icon icon-vol-high" viewBox="0 0 24 24">
                                <polygon points="3,9 7,9 12,4 12,20 7,15 3,15" fill="currentColor"/>
                                <path d="M15.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <path d="M18 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                            <svg class="icon icon-vol-low" viewBox="0 0 24 24">
                                <polygon points="3,9 7,9 12,4 12,20 7,15 3,15" fill="currentColor"/>
                                <path d="M15.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                            <svg class="icon icon-vol-mute" viewBox="0 0 24 24">
                                <polygon points="3,9 7,9 12,4 12,20 7,15 3,15" fill="currentColor"/>
                                <line x1="16" y1="8" x2="22" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <line x1="22" y1="8" x2="16" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </button>
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" />
                    </div>
                    
                    <button class="ctrl-btn" id="episodesBtn" title="Выбор серии">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
                            <line x1="7" y1="2" x2="7" y2="22"></line>
                            <line x1="17" y1="2" x2="17" y2="22"></line>
                            <line x1="2" y1="12" x2="22" y2="12"></line>
                            <line x1="2" y1="7" x2="7" y2="7"></line>
                            <line x1="2" y1="17" x2="7" y2="17"></line>
                            <line x1="17" y1="17" x2="22" y2="17"></line>
                            <line x1="17" y1="7" x2="22" y2="7"></line>
                        </svg>
                    </button>

                    <!-- Кнопка настроек (шестеренка) -->
                    <button class="ctrl-btn" id="settingsBtn" title="Настройки">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </button>

                    <div class="spacer"></div>
                    <button class="ctrl-btn" id="fullscreenBtn" title="На весь экран">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 9V4h5"/>
                            <path d="M20 9V4h-5"/>
                            <path d="M4 15v5h5"/>
                            <path d="M20 15v5h-5"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Окно выбора серий -->
        <div class="episodes-popup hidden" id="episodesPopup">
            <div class="popup-header">
                <h3>Выбор серии</h3>
                <button class="popup-close" id="popupClose" title="Закрыть">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="6" y1="6" x2="18" y2="18"/>
                        <line x1="18" y1="6" x2="6" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="popup-list" id="popupList"></div>
        </div>

        <!-- Окно настроек -->
        <div class="settings-popup hidden" id="settingsPopup">
            <!-- Главный экран настроек -->
            <div id="settingsMain" class="settings-tab">
                <div class="popup-header">
                    <h3>Настройки</h3>
                    <button class="popup-close" id="settingsClose" title="Закрыть">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
                    </button>
                </div>
                <div class="settings-list">
                    <div class="settings-item" id="openQualitySettings">
                        <span>Качество</span>
                        <div class="settings-value">
                            <span id="currentQualityText">AUTO</span>
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                        </div>
                    </div>
                    <div class="settings-item disabled">
                        <span>Субтитры</span>
                        <div class="settings-value"><span>Скоро</span></div>
                    </div>
                </div>
            </div>

            <!-- Экран выбора качества -->
            <div id="settingsQuality" class="settings-tab hidden">
                <div class="popup-header">
                    <button class="popup-back" id="settingsBack" title="Назад">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
                        </svg>
                    </button>
                    <h3>Качество</h3>
                    <button class="popup-close" id="qualityClose" title="Закрыть">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
                    </button>
                </div>
                <div class="quality-popup-list" id="qualityPopupList"></div>
            </div>
        </div>

        <div id="endMessage" class="end-message hidden">
            <h2>Конец сезона</h2>
            <div class="end-buttons">
                <button id="restartBtn">Посмотреть заново</button>
                <button id="backBtn">На главную</button>
            </div>
        </div>
    </div>
    <script src="player_v2.js"></script>
</body>
</html>
