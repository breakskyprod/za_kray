<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>За край — проекты</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="za_kray.css" />
    <meta name="theme-color" content="#0b0b1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <style>
        .landing-main { max-width: var(--page-max, 1120px); margin: 0 auto; padding: 60px 24px 40px; }
        .landing-kicker { display:inline-block; font-size:.75rem; letter-spacing:.32em; text-transform:uppercase; color:#9aa3b8; margin-bottom:10px; }
        .landing-title { font-size:clamp(2.2rem,6vw,3.6rem); font-weight:800; line-height:1.05; margin-bottom:36px;
            background:linear-gradient(135deg,#fff 0%,#4A9EFF 55%,#A45CFF 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
        .about-footer { text-align:center; font-size:.8rem; color:#9aa3b8; padding:24px 16px 32px; }

        /* Окно пароля (стили внутри файла, без зависимостей) */
        .gate-modal { position:fixed; inset:0; z-index:9000; display:none; align-items:center; justify-content:center; padding:20px; }
        .gate-modal.is-open { display:flex; }
        .gate-backdrop { position:absolute; inset:0; background:rgba(5,5,14,.72); backdrop-filter:blur(10px); }
        .gate-box { position:relative; width:100%; max-width:380px; padding:34px 28px 28px; border-radius:24px; text-align:center;
            background:linear-gradient(160deg,rgba(30,30,68,.95),rgba(12,12,28,.97)); border:1px solid rgba(255,255,255,.1);
            box-shadow:0 30px 80px rgba(0,0,0,.6); color:#fff; }
        .gate-close { position:absolute; top:12px; right:12px; width:34px; height:34px; border:none; border-radius:50%;
            background:rgba(255,255,255,.06); color:#9aa3b8; font-size:18px; cursor:pointer; }
        .gate-lock { width:58px; height:58px; margin:0 auto 16px; display:flex; align-items:center; justify-content:center;
            font-size:24px; border-radius:18px; background:rgba(74,158,255,.1); border:1px solid rgba(74,158,255,.25); }
        .gate-title { font-size:1.35rem; font-weight:700; margin-bottom:6px; }
        .gate-sub { font-size:.92rem; color:#9aa3b8; margin-bottom:22px; }
        .gate-input { width:100%; padding:15px 18px; border-radius:14px; border:1.5px solid rgba(255,255,255,.12);
            background:rgba(0,0,0,.35); color:#fff; font-size:1rem; text-align:center; letter-spacing:.12em; }
        .gate-input:focus { outline:none; border-color:#4A9EFF; box-shadow:0 0 0 4px rgba(74,158,255,.18); }
        .gate-error { min-height:22px; margin:10px 0 8px; font-size:.88rem; color:#ff7a8a; }
        .gate-submit { width:100%; padding:15px; border:none; border-radius:14px; font-size:1rem; font-weight:700; color:#fff; cursor:pointer;
            background:linear-gradient(135deg,#4A9EFF,#A45CFF); }
        .gate-submit:disabled { opacity:.6; cursor:wait; }
        .gate-box.shake { animation: gateShake .42s; }
        @keyframes gateShake { 10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)} 30%,50%,70%{transform:translateX(-7px)} 40%,60%{transform:translateX(7px)} }
        body.gate-open { overflow:hidden; }
    </style>
</head>
<body class="landing">

<div class="top-brandbar">
    <img class="top-brandbar-logo" src="/images/brandbar.svg" alt="Продакшн" onerror="this.style.display='none'" />
</div>

<!-- Прелоадер -->
<div class="preloader" id="preloader">
    <div class="pl-grain" aria-hidden="true"></div>
    <div class="pl-glow" aria-hidden="true"></div>
    <div class="pl-core">
        <div class="pl-mark" aria-hidden="true">
            <span class="pl-mark-dot"></span><span class="pl-mark-line"></span><span class="pl-mark-arrow"></span>
        </div>
        <div class="pl-word">
            <span class="pl-word-text">ЗА&nbsp;КРАЙ</span><span class="pl-word-sheen" aria-hidden="true"></span>
        </div>
        <div class="pl-sub">видеосервис</div>
        <div class="pl-progress" aria-hidden="true"><span class="pl-progress-fill"></span></div>
    </div>
</div>

<main class="landing-main">
    <span class="landing-kicker">Видеосервис</span>
    <h1 class="landing-title">Проекты</h1>

    <section class="catalog-section">
        <div class="poster-rail" id="catalogCarousel" role="list">
            <div class="poster-rail-skeleton"></div>
            <div class="poster-rail-skeleton"></div>
            <div class="poster-rail-skeleton"></div>
        </div>
    </section>
</main>

<footer class="about-footer">© За край · 2027 · Центр профилактики · Все права защищены</footer>

<!-- Окно пароля -->
<div class="gate-modal" id="gateModal" role="dialog" aria-modal="true">
    <div class="gate-backdrop" data-gate-close></div>
    <div class="gate-box">
        <button class="gate-close" data-gate-close aria-label="Закрыть">✕</button>
        <div class="gate-lock">🔒</div>
        <h2 class="gate-title">Закрытый показ</h2>
        <p class="gate-sub">Введите пароль, чтобы открыть проект</p>
        <form id="gateForm" autocomplete="off">
            <input type="password" id="gateInput" class="gate-input" placeholder="Пароль" />
            <div class="gate-error" id="gateError" aria-live="polite"></div>
            <button type="submit" class="gate-submit">Открыть</button>
        </form>
    </div>
</div>

<script>
// 1. Прелоадер: один раз за сессию
(function () {
    var pl = document.getElementById('preloader');
    try { if (sessionStorage.getItem('intro_shown')) { pl.classList.add('hidden'); return; } } catch (e) {}
    setTimeout(function () {
        pl.classList.add('hidden');
        try { sessionStorage.setItem('intro_shown', '1'); } catch (e) {}
    }, 3200);
})();

// 2. Карусель и окно пароля
(function () {
    var rail = document.getElementById('catalogCarousel');
    var modal = document.getElementById('gateModal');
    var form = document.getElementById('gateForm');
    var input = document.getElementById('gateInput');
    var errBox = document.getElementById('gateError');
    var box = modal.querySelector('.gate-box');
    var btn = form.querySelector('.gate-submit');
    var nextUrl = '/series.html';

    function esc(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function posterUrl(p) {
        if (!p) return '';
        if (/^https?:\/\//i.test(p) || p.charAt(0) === '/') return p;
        return '/uploads/' + p;
    }
    function safeNext(p) {
        if (typeof p !== 'string' || p.charAt(0) !== '/' || p.charAt(1) === '/') return '/series.html';
        return p;
    }

    function openGate(next) {
        nextUrl = safeNext(next);
        errBox.textContent = '';
        input.value = '';
        modal.classList.add('is-open');
        document.body.classList.add('gate-open');
        setTimeout(function () { input.focus(); }, 50);
    }
    function closeGate() {
        modal.classList.remove('is-open');
        document.body.classList.remove('gate-open');
    }
    function shake(msg) {
        errBox.textContent = msg;
        box.classList.remove('shake');
        void box.offsetWidth;
        box.classList.add('shake');
    }

    modal.addEventListener('click', function (e) {
        if (e.target.hasAttribute('data-gate-close')) closeGate();
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeGate(); });

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        var pwd = input.value;
        if (!pwd) { shake('Введите пароль'); return; }
        btn.disabled = true;
        fetch('/api/access', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pwd })
        }).then(function (r) {
            if (r.ok) { window.location.href = nextUrl; return; }
            if (r.status === 429) shake('Слишком много попыток. Подождите 15 минут.');
            else if (r.status === 503) shake('Доступ временно недоступен');
            else shake('Неверный пароль');
        }).catch(function () {
            shake('Нет соединения с сервером');
        }).finally(function () { btn.disabled = false; });
    });

    // Переход с /series.html без доступа: ?gate=1&next=/series.html
    var params = new URLSearchParams(window.location.search);
    if (params.get('gate') === '1') openGate(params.get('next'));

    function buildCard(item) {
        var locked = !!item.locked;
        var a = document.createElement('a');
        a.className = 'poster-card' + (locked ? ' is-locked' : '');
        a.setAttribute('role', 'listitem');
        a.href = item.href || '#';
        a.setAttribute('aria-label', item.title || 'Открыть');

        var media = document.createElement('div');
        media.className = 'poster-card__media';
        var bg = posterUrl(item.poster);
        if (bg) media.style.backgroundImage = "url('" + bg + "'), linear-gradient(145deg,#1a1a3e,#0b0b1a)";

        var inner = '';
        if (locked) inner += '<span class="poster-card__badge poster-card__badge--soon">Скоро</span>';
        else if (item.badge) inner += '<span class="poster-card__badge">' + esc(item.badge) + '</span>';
        inner += '<div class="poster-card__title' + (locked ? ' is-locked' : '') + '">' + esc(item.title) + '</div>';
        if (locked) inner += '<div class="poster-card__lock"><span>Закрыто</span></div>';
        media.innerHTML = inner;
        a.appendChild(media);

        if (locked) {
            a.addEventListener('click', function (e) {
                e.preventDefault();
                openGate(item.href);
            });
        }
        return a;
    }

    function render(items) {
        rail.innerHTML = '';
        if (!items.length) {
            rail.innerHTML = '<p class="poster-rail-empty">Пока ничего нет</p>';
            return;
        }
        items.forEach(function (it) { rail.appendChild(buildCard(it)); });
    }

    fetch('/api/catalog')
        .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function (d) { render((d && d.items) || []); })
        .catch(function () { render([]); });
})();
</script>
</body>
</html
